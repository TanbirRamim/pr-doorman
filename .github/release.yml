changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: New checks and features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, fix]
    - title: Docs
      labels: [documentation]
    - title: Other changes
      labels: ['*']
