name: Bug report
description: A check flagged something it shouldn't have, missed something, or the action failed.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Link the PR if it's public. If a check misfired, say which one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Your workflow file
      description: The pr-doorman step with its inputs is enough.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: The lines from the pr-doorman step, or the step summary table.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0 or a commit SHA
